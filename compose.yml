services:
  stremio-offline:
    build: .
    image: stremio-offline:local
    container_name: stremio-offline
    restart: unless-stopped
    init: true
    ports:
      - "${STREMIO_OFFLINE_PORT:-8090}:8080"
    environment:
      TZ: "${TZ:-Europe/Prague}"
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      ALLOW_PRIVATE_ADDONS: "${ALLOW_PRIVATE_ADDONS:-0}"
    volumes:
      - stremio-offline-data:/data
      - "${DOWNLOAD_PATH:-./downloads}:/downloads"

volumes:
  stremio-offline-data:

