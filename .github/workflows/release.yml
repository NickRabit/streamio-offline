name: Vydání verze

# Otagujete commit a zbytek už jde sám: tahle úloha si zavolá "Obraz pro NAS",
# takže se vydávaná verze sestaví a otestuje ze stejného commitu, na který tag
# ukazuje -- není tedy co si splést. Ke značkám :latest a :<sha>, které přidává
# samotné sestavení, přibudou ještě :<verze> a :<major.minor>.
#
# Vydání: git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*.*.*"]

jobs:
  verze:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  obraz:
    needs: verze
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      znacky: "${{ needs.verze.outputs.version }} ${{ needs.verze.outputs.minor }}"

  # Vydání na GitHubu vzniká až po úspěšném sestavení, aby v seznamu vydání
  # nestála verze, jejíž obraz se nepovedlo postavit.
  vydani:
    needs: obraz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vydání na GitHubu s automatickými poznámkami
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
