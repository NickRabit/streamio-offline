name: Vydání verze

# Verzovaný build nestaví nic nového -- otagujete commit, který "Obraz pro NAS"
# už postavil a otestoval (obvykle špička main), a tahle úloha jen přidá čitelné
# značky ke stejnému otisku. Bez samostatného sestavení tak odpadá otázka, jestli
# se release náhodou nesestavil z něčeho jiného než to, co běželo na main.
#
# Vydání: git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*.*.*"]

jobs:
  otagovat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Určit verzi a název obrazu
        id: verze
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Otisk, na který tag ukazuje, musí už mít "Obraz pro NAS" postavený a
      # odeslaný pod :<sha> -- to je normální stav, když se značí commit z main.
      - name: Přidat verzi ke stejnému otisku
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.verze.outputs.version }}" \
            -t "$IMAGE:${{ steps.verze.outputs.minor }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}"
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.verze.outputs.version }}"

      - name: Vydání na GitHubu s automatickými poznámkami
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
