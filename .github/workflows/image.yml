name: Sestavení obrazu

# Sestavení pro amd64 trvá na NASu dlouho a Container Manager navíc staví
# klasickým builderem, kde se snadno ztratí ovladače VAAPI. Obraz proto vzniká tady
# a NAS ho jen stáhne. arm64 se přidává kvůli Macům s Apple Silicon -- Docker si
# na nich pak obraz stáhne sám místo osmiminutového sestavování přes emulaci.
#
# Na push se nestaví -- commitů děláme hodně a obraz z každého z nich by byl
# zbytečný běh. Sestavení spouští buď člověk (Actions -> Sestavení obrazu -> Run
# workflow), nebo "Vydání verze", které si tuhle úlohu zavolá přes workflow_call.
# Až se vývoj přesune na větve a do main se bude slévat hotová práce, dává smysl
# vrátit sem "on: push: branches: [main]".
on:
  workflow_dispatch:
    inputs:
      balik:
        description: "Přiložit i balík ke stažení pro amd64 (docker save, ~250 MB)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      znacky:
        description: "Značky navíc k :latest a :<sha>, oddělené mezerou"
        type: string
        default: ""
      balik:
        type: boolean
        default: false

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p web
      - run: npm test

  # Každá architektura se staví na svém stroji (repozitář je veřejný, takže má
  # zdarma k dispozici i nativní arm64 runner) a odešle se do GHCR jen jako otisk --
  # bez značky. Značku (latest, otisk commitu) dostane až spojený seznam v úloze
  # "spojit", jinak by druhá architektura tu první přepsala.
  obraz:
    needs: testy
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR přijímá jen malá písmena, kdežto github.repository nese jméno vlastníka
      # tak, jak je zapsané na GitHubu. Název proto odvozujeme převodem, ne ručně.
      - name: Určit název obrazu, čas sestavení a bezpečné jméno platformy
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "PLATFORM_SLUG=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sestavit a odeslat otisk
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_TIME=${{ env.BUILD_TIME }}
            GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Uložit otisk k pozdějšímu spojení
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Otisky obou architektur se spojí do jednoho seznamu, který teprve dostane
  # skutečné značky. Docker pak z něj sám vybere tu, co sedí na klienta.
  spojit:
    needs: obraz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # Značky navíc chodí zvenčí (z "Vydání verze"), takže se do příkazu dostávají
      # přes proměnnou prostředí, ne dosazením do textu skriptu.
      - name: Vytvořit a odeslat seznam
        working-directory: /tmp/digests
        env:
          ZNACKY: ${{ inputs.znacky }}
        run: |
          navic=""
          for znacka in $ZNACKY; do navic="$navic -t $IMAGE:$znacka"; done
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            $navic \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # Ovladače chyběly v obraze kvůli prázdnému ARG TARGETARCH; ať to nikdo znovu
  # nepřehlédne, hotový amd64 obraz se rovnou zkontroluje. arm64 se nekontroluje --
  # ovladače tam Dockerfile schválně nedává, na tom stroji QuickSync nejede.
  overit:
    needs: spojit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Ověřovací job běží na jiném stroji než sestavení, takže si musí přihlášení
      # zopakovat -- přihlašovací údaje z dřívějšího "docker login" se s ním nesdílejí.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Zkontrolovat ovladače VAAPI v amd64 obraze
        run: |
          IMAGE="${{ needs.spojit.outputs.image }}"
          docker pull --platform linux/amd64 "$IMAGE:${{ github.sha }}"
          drivers=$(docker run --rm --platform linux/amd64 "$IMAGE:${{ github.sha }}" sh -lc 'ls /usr/lib/x86_64-linux-gnu/dri/ | grep drv_video | tr "\n" " "')
          echo "Nalezené ovladače: $drivers"
          case "$drivers" in
            *iHD_drv_video.so*) ;;
            *) echo "::error::V amd64 obraze chybí ovladače VAAPI, QuickSync by na NASu nejel."; exit 1 ;;
          esac

      - name: Zabalit amd64 ke stažení
        if: inputs.balik
        run: |
          mkdir -p dist
          docker save "${{ needs.spojit.outputs.image }}:${{ github.sha }}" | gzip -1 > dist/stremio-offline-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        if: inputs.balik
        with:
          name: stremio-offline-amd64
          path: dist/stremio-offline-amd64.tar.gz
          retention-days: 14
