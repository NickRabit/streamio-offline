name: Obraz pro NAS

# Sestavení pro amd64 trvá na NASu dlouho a Container Manager navíc staví
# klasickým builderem, kde se snadno ztratí ovladače VAAPI. Obraz proto vzniká tady
# a NAS ho jen stáhne.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/image.yml"
  workflow_dispatch:
    inputs:
      balik:
        description: "Přiložit i balík ke stažení (docker save, ~250 MB)"
        type: boolean
        default: false

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p server
      - run: npx tsc --noEmit -p web
      - run: npm test

  obraz:
    needs: testy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR přijímá jen malá písmena, kdežto github.repository nese jméno vlastníka
      # tak, jak je zapsané na GitHubu. Název proto odvozujeme převodem, ne ručně.
      - name: Určit název obrazu
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sestavit a odeslat
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ovladače chyběly v obraze kvůli prázdnému ARG TARGETARCH; ať to nikdo
      # znovu nepřehlédne, sestavený obraz se rovnou zkontroluje.
      - name: Zkontrolovat ovladače VAAPI
        run: |
          docker pull "$IMAGE:${{ github.sha }}"
          drivers=$(docker run --rm "$IMAGE:${{ github.sha }}" sh -lc 'ls /usr/lib/x86_64-linux-gnu/dri/ | grep drv_video | tr "\n" " "')
          echo "Nalezené ovladače: $drivers"
          case "$drivers" in
            *iHD_drv_video.so*) ;;
            *) echo "::error::V obraze chybí ovladače VAAPI, QuickSync by na NASu nejel."; exit 1 ;;
          esac

      - name: Zabalit ke stažení
        if: inputs.balik
        run: |
          mkdir -p dist
          docker save "$IMAGE:${{ github.sha }}" | gzip -1 > dist/stremio-offline-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        if: inputs.balik
        with:
          name: stremio-offline-amd64
          path: dist/stremio-offline-amd64.tar.gz
          retention-days: 14
