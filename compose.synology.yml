# Hardware conversion through Intel QuickSync (Synology with an Intel iGPU,
# generally any Linux box with /dev/dri).
#
# Start:  docker compose -f compose.yml -f compose.synology.yml up -d --build
#
# Find the group that owns the render node on the NAS with:
#   stat -c "%g" /dev/dri/renderD128
# and set it in .env as RENDER_GID (default 937 is videodriver on typical
# DSM 7). If hardware conversion does not start, the server falls back to
# software on its own -- the worse case is only slower transcode.
services:
  stremio-offline:
    environment:
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      RENDER_GID: "${RENDER_GID:-937}"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-937}"
